name: release

# Every push to main is a release: bump the patch version, build on native
# runners for each OS (macOS included, so adzantray gets built for darwin
# too - see the Makefile comment above `release:`), then tag + publish.
#
# The publish job commits the regenerated Formula/adzan.rb back to main
# with "[skip ci]" in the message - GitHub skips workflow runs for commits
# whose message contains that, which is what stops this from re-triggering
# itself in a loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: ver
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          latest=${latest#v}
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<<"$latest"
          echo "version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # adzantray is pure Go on linux (dbus) and windows (win32), so a
          # single ubuntu runner cross-builds all three of these fine.
          - runner: ubuntu-latest
            targets: "linux/amd64 linux/arm64 windows/amd64"
            name: linux-windows
          # adzantray needs cgo + Cocoa on darwin, so these two need to run
          # natively on the matching Mac. macos-13 is Intel, macos-14 is
          # Apple Silicon - if GitHub retires macos-13, replace it with a
          # cross build (`CC="clang -arch x86_64"` on a macos-14 runner).
          - runner: macos-13
            targets: "darwin/amd64"
            name: darwin-amd64
          - runner: macos-14
            targets: "darwin/arm64"
            name: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make release VERSION=${{ needs.version.outputs.version }} TARGETS="${{ matrix.targets }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > checksums.txt && ls -lh
      - run: make deb VERSION=$VERSION
      - run: make formula VERSION=$VERSION
      - name: commit formula and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/adzan.rb
          git commit -m "chore: release v$VERSION [skip ci]" || echo "no formula changes"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
      - name: create GitHub release
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.deb \
            --title "v$VERSION" --generate-notes
